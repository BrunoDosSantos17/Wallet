spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/wallet
    username: proposaldb
    password: docker
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

brapi:
  token:  ${BRAPI_TOKEN}